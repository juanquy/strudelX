name: Sync to Hugging Face Space

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  sync-to-hub:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN || secrets.HUGGINGFACE_TOKEN || secrets.HUGGING_FACE_HUB_TOKEN || secrets.HF_API_KEY || secrets.SPACE_TOKEN }}
          HF_SPACE_URL: ${{ secrets.HF_SPACE_URL }}
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo "::warning::Secret 'HF_TOKEN' is not configured in GitHub Secrets. Skipping Hugging Face Space sync."
            echo "ℹ️ To enable auto-sync, add 'HF_TOKEN' (your Hugging Face write token) at: https://github.com/juanquy/strudelX/settings/secrets/actions"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Clean target Space URL
          TARGET_URL="${HF_SPACE_URL:-huggingface.co/spaces/juanquy/strudelx.git}"
          TARGET_URL="${TARGET_URL#https://}"
          TARGET_URL="${TARGET_URL#http://}"
          TARGET_URL="${TARGET_URL%/}"
          if [[ "$TARGET_URL" != *.git ]]; then
            TARGET_URL="${TARGET_URL}.git"
          fi

          echo "🚀 Preparing clean ZeroGPU Space deployment for: ${TARGET_URL}"

          # Create clean orphan branch with ONLY Space runtime files
          git branch -D hf-space 2>/dev/null || true
          git checkout --orphan hf-space
          git rm -rf --cached . >/dev/null 2>&1 || true
          git add -f app.py README.md requirements.txt

          git commit -m "Auto-sync ZeroGPU AI Backend from GitHub Actions [skip ci]"

          # Push to Hugging Face Space
          git remote remove space 2>/dev/null || true
          git remote add space "https://juanquy:${HF_TOKEN}@${TARGET_URL}"
          git push space hf-space:main --force
          echo "✅ Successfully synced to Hugging Face Space!"
